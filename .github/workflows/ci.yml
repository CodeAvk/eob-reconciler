# Runs on every push to main and every pull request. Three independent jobs:
#   backend   - pytest (in-memory repo, storage and queue; Gemini calls are mocked) and pip-audit
#   frontend  - clean install, production build, typecheck and npm audit
#   secrets   - gitleaks over the new commits in each push or pull request (not the full history)
# No repository secrets are used: the tests need no Gemini key, MongoDB, Redis or MinIO.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Dependency audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The build generates next-env.d.ts, which the typecheck needs, so it runs first.
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full clone so gitleaks can resolve the push or pull request commit range.
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep the job read-only: report in the job summary, not as PR comments.
          GITLEAKS_ENABLE_COMMENTS: false
